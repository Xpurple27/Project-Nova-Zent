
name: Verify NOVA ZENITH
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NOVA_ENABLE_OFFLINE_DEMO: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      # Public configuration for the isolated browser tests; Auth is mocked there.
      NEXT_PUBLIC_SUPABASE_URL: "https://bbeymvooubwsbrkeukuu.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_Y2cVkp1j_Oo55oiTu4rO6w_ge3yPJW6"
      NEXT_PUBLIC_HCAPTCHA_SITE_KEY: "69c6ee50-ea78-49ba-81cc-781a89ec15be"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run check:edge
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install browser for UI checks
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Retain dependency lockfile after successful verification
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: lock verified dependencies"
            git push
          fi
