name: Regenerate Edge Bundle
on:
  push:
    branches: [feat/school-level-question-bank]
permissions:
  contents: write
jobs:
  bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/school-level-question-bank
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run bundle:edge
      - name: Commit generated bundle
        run: |
          if git diff --quiet -- supabase/functions/nova-combat/index.js; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/nova-combat/index.js
          git commit -m 'chore: regenerate nova-combat edge bundle'
          git push
